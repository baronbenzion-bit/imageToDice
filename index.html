<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>תמונה לקוביות</title>
<style>
  :root {
    --bg: #f4f1ea; --panel: #ffffff; --ink: #1d1d1f; --muted: #6b6b70;
    --accent: #e8890c; --border: #ddd6c8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16161a; --panel: #212127; --ink: #f2f2f2; --muted: #a0a0a8; --border: #34343c; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  }
  header { padding: 24px 16px 8px; text-align: center; }
  h1 { margin: 0; font-size: clamp(28px, 6vw, 44px); letter-spacing: -0.5px; }
  h1 span { color: var(--accent); }
  header p { color: var(--muted); margin: 6px 0 0; }
  main {
    max-width: 1200px; margin: 0 auto; padding: 16px;
    display: grid; grid-template-columns: 300px 1fr; gap: 16px; align-items: start;
  }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
  .controls label { display: block; font-size: 14px; margin: 14px 0 6px; font-weight: 600; }
  .controls label output { float: left; color: var(--accent); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .drop {
    border: 2px dashed var(--border); border-radius: 12px; padding: 20px 12px;
    text-align: center; cursor: pointer; color: var(--muted); transition: .15s;
  }
  .drop:hover, .drop.over { border-color: var(--accent); color: var(--ink); }
  .drop input { display: none; }
  .seg { display: flex; gap: 6px; }
  .seg button {
    flex: 1; padding: 8px; border-radius: 8px; border: 1px solid var(--border);
    background: transparent; color: var(--ink); cursor: pointer; font: inherit; font-size: 14px;
  }
  .seg button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .check { display: flex; align-items: center; gap: 8px; font-weight: 400 !important; }
  .btn {
    width: 100%; margin-top: 18px; padding: 12px; border: 0; border-radius: 10px;
    background: var(--ink); color: var(--bg); font: inherit; font-weight: 600; cursor: pointer;
  }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.alt { background: transparent; color: var(--ink); border: 1px solid var(--border); margin-top: 8px; }
  .btn.alt:hover:not(:disabled) { border-color: var(--accent); }

  /* ---------- Printable build plan ---------- */
  #print { display: none; }
  @media print {
    @page { size: A4; margin: 8mm; }
    body { background: #fff; color: #000; }
    body > *:not(#print) { display: none !important; }
    #print { display: block; }
    .ppage { break-after: page; page-break-after: always; text-align: center; }
    .ppage:last-child { break-after: auto; page-break-after: auto; }
    .ppage h2 { font-size: 18pt; margin: 0 0 2mm; }
    .ppage h3 { font-size: 13pt; margin: 0 0 3mm; }
    .ppage p, .ppage li { font-size: 10pt; margin: 1mm 0; }
    .ppage ul { text-align: right; display: inline-block; margin: 2mm 0; }
    .overview { max-width: 100%; max-height: 150mm; margin: 3mm auto; display: block; }
    .legend { display: flex; justify-content: center; gap: 5mm; margin: 3mm 0; direction: ltr; }
    .legend div { font-size: 10pt; font-weight: 700; }
    .legend img { width: 11mm; height: 11mm; display: block; margin: 0 auto 1mm; }
    table.grid { border-collapse: collapse; direction: ltr; margin: 0 auto;
      -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    table.grid td, table.grid th { width: 6mm; height: 6mm; padding: 0; text-align: center;
      font-size: 3.3mm; border: 0.15mm solid #888; font-variant-numeric: tabular-nums; }
    table.grid th { font-size: 2.2mm; font-weight: 400; color: #555; border: 0; }
    table.grid td.r5 { border-right: 0.5mm solid #000; }
    table.grid td.b5 { border-bottom: 0.5mm solid #000; }
  }
  .stage { min-height: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .stage canvas { max-width: 100%; height: auto; border-radius: 6px; box-shadow: 0 4px 24px rgba(0,0,0,.18); }
  .seg + .seg { margin-top: 6px; }

  /* Before/after comparison: the original image sits on top of the dice,
     clipped to the left of the draggable divider. */
  .cmp { position: relative; max-width: 100%; line-height: 0; --p: 50%; }
  .cmp #orig, .cmp .handle, .cmp .tag { display: none; }
  .cmp.on { cursor: ew-resize; touch-action: pan-y; user-select: none; }
  .cmp.on #orig, .cmp.on .handle, .cmp.on .tag { display: block; }
  #orig { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 6px;
    box-shadow: none; clip-path: inset(0 calc(100% - var(--p)) 0 0); }
  .handle { position: absolute; top: 0; bottom: 0; left: var(--p); width: 3px;
    background: var(--accent); transform: translateX(-50%); pointer-events: none; }
  .handle::after { content: "⇔"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: #fff;
    font-size: 20px; line-height: 34px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
  .tag { position: absolute; top: 8px; padding: 3px 8px; border-radius: 6px; font-size: 12px; line-height: 1.4;
    background: rgba(0,0,0,.6); color: #fff; pointer-events: none; }
  .tag.l { left: 8px; } .tag.r { right: 8px; }
  .empty { color: var(--muted); text-align: center; }

  /* ---------- Manual crop dialog ---------- */
  .modal { position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.75);
    display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal[hidden] { display: none; }
  .mbox { background: var(--panel); border-radius: 14px; padding: 16px; max-width: 100%;
    display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .mbox h2 { margin: 0; font-size: 18px; }
  .cropArea { position: relative; line-height: 0; direction: ltr; margin: 8px;
    touch-action: none; user-select: none; -webkit-user-select: none; cursor: crosshair; }
  .cropArea img { max-width: min(86vw, 900px); max-height: 62vh; display: block; pointer-events: none; }
  /* Dimming lives in its own clipped layer so the handles can overhang the image edge */
  .shadeClip { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .shade { position: absolute; box-shadow: 0 0 0 9999px rgba(0,0,0,.55); }
  .cbox { position: absolute; outline: 2px solid #fff; cursor: move;
    background:
      linear-gradient(rgba(255,255,255,.45), rgba(255,255,255,.45)) 33.33% 0 / 1px 100% no-repeat,
      linear-gradient(rgba(255,255,255,.45), rgba(255,255,255,.45)) 66.66% 0 / 1px 100% no-repeat,
      linear-gradient(rgba(255,255,255,.45), rgba(255,255,255,.45)) 0 33.33% / 100% 1px no-repeat,
      linear-gradient(rgba(255,255,255,.45), rgba(255,255,255,.45)) 0 66.66% / 100% 1px no-repeat; }
  .cbox i { position: absolute; width: 16px; height: 16px; background: #fff; border: 2px solid var(--accent);
    border-radius: 3px; transform: translate(-50%, -50%); }
  .cbox i[data-h=nw] { left: 0; top: 0; cursor: nwse-resize; }   .cbox i[data-h=n] { left: 50%; top: 0; cursor: ns-resize; }
  .cbox i[data-h=ne] { left: 100%; top: 0; cursor: nesw-resize; } .cbox i[data-h=e] { left: 100%; top: 50%; cursor: ew-resize; }
  .cbox i[data-h=se] { left: 100%; top: 100%; cursor: nwse-resize; } .cbox i[data-h=s] { left: 50%; top: 100%; cursor: ns-resize; }
  .cbox i[data-h=sw] { left: 0; top: 100%; cursor: nesw-resize; } .cbox i[data-h=w] { left: 0; top: 50%; cursor: ew-resize; }
  .cropInfo { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .mbtns { display: flex; gap: 8px; width: 100%; }
  .mbtns .btn { margin: 0; flex: 1; }
  .stats { margin-top: 14px; font-size: 14px; color: var(--muted); text-align: center; line-height: 1.7; }
  .stats b { color: var(--ink); }
</style>
</head>
<body>
<header>
  <h1>תמונה ל<span>קוביות</span> 🎲</h1>
  <p>העלו תמונה והיא תורכב מאלפי קוביות משחק</p>
</header>

<main>
  <section class="panel controls">
    <label class="drop" id="drop">
      <input type="file" id="file" accept="image/*">
      📷 לחצו לבחירת תמונה<br><small>או גררו אותה לכאן</small>
    </label>

    <label>רוחב (מספר קוביות) <output id="colsOut">80</output></label>
    <input type="range" id="cols" min="20" max="200" value="80">

    <label>גובה (מספר קוביות) <output id="rowsOut">60</output></label>
    <input type="range" id="rows" min="10" max="400" value="60">

    <label>יחס רוחב:גובה</label>
    <div class="seg" id="ratio">
      <button data-r="orig" class="on">מקורי</button>
      <button data-r="1">ריבוע</button>
      <button data-r="0.75">3:4</button>
      <button data-r="1.3333">4:3</button>
    </div>
    <div class="seg" id="fit">
      <button data-v="crop" class="on" title="חותך את השוליים כדי לשמור על פרופורציות">✂ חיתוך</button>
      <button data-v="stretch" title="מותח/מכווץ את התמונה לגודל החדש">↔ מתיחה</button>
    </div>
    <button class="btn alt" id="cropBtn" disabled>✂ חיתוך ידני</button>

    <label>בהירות <output id="briOut">0</output></label>
    <input type="range" id="bri" min="-100" max="100" value="0">

    <label>ניגודיות <output id="conOut">0</output></label>
    <input type="range" id="con" min="-100" max="100" value="0">

    <label>צבע הקוביות</label>
    <div class="seg" id="style">
      <button data-v="black" class="on">שחורות</button>
      <button data-v="white">לבנות</button>
    </div>

    <label class="check"><input type="checkbox" id="dither" checked> החלקת מעברים (Dithering)</label>
    <label class="check"><input type="checkbox" id="invert"> היפוך</label>
    <label class="check"><input type="checkbox" id="compare"> השוואה למקור (סליידר)</label>

    <button class="btn" id="download" disabled>⬇ הורדת התמונה</button>
    <button class="btn alt" id="replay" disabled>🎲 גלגלו שוב</button>
    <button class="btn alt" id="printBtn" disabled>🖨 הדפסת תוכנית בנייה</button>
  </section>

  <section class="panel stage" id="stage">
    <div class="empty" id="empty">🎲<br>עוד לא נבחרה תמונה</div>
    <div class="cmp" id="cmp">
      <canvas id="out" hidden></canvas>
      <canvas id="orig"></canvas>
      <div class="handle"></div>
      <span class="tag l">מקור</span><span class="tag r">קוביות</span>
    </div>
    <div class="stats" id="stats"></div>
  </section>
</main>
<div id="print"></div>

<div class="modal" id="cropModal" hidden>
  <div class="mbox">
    <h2>✂ חיתוך התמונה</h2>
    <div class="cropArea" id="cropArea">
      <img id="cropImg" alt="">
      <div class="shadeClip"><div class="shade" id="shade"></div></div>
      <div class="cbox" id="cbox">
        <i data-h="nw"></i><i data-h="n"></i><i data-h="ne"></i><i data-h="e"></i>
        <i data-h="se"></i><i data-h="s"></i><i data-h="sw"></i><i data-h="w"></i>
      </div>
    </div>
    <div class="seg" id="cropRatio" style="width:100%">
      <button data-r="free" class="on">חופשי</button>
      <button data-r="1">1:1</button>
      <button data-r="0.75">3:4</button>
      <button data-r="1.3333">4:3</button>
      <button data-r="1.7778">16:9</button>
    </div>
    <div class="cropInfo" id="cropInfo"></div>
    <div class="mbtns">
      <button class="btn" id="cropOk">אישור</button>
      <button class="btn alt" id="cropReset">איפוס</button>
      <button class="btn alt" id="cropCancel">ביטול</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const out = $("out"), ctx = out.getContext("2d");
let img = null, style = "black";
let cur = null;     // last computed mosaic: { faces, cols, rows, s, bg, sprites }
let animId = 0;     // requestAnimationFrame handle of the rolling animation

// Pip positions for faces 1..6 on a 3x3 grid (0..2)
const PIPS = {
  1: [[1,1]],
  2: [[0,0],[2,2]],
  3: [[0,0],[1,1],[2,2]],
  4: [[0,0],[2,0],[0,2],[2,2]],
  5: [[0,0],[2,0],[1,1],[0,2],[2,2]],
  6: [[0,0],[2,0],[0,1],[2,1],[0,2],[2,2]],
};

function loadFile(f) {
  if (!f || !f.type.startsWith("image/")) return;
  const url = URL.createObjectURL(f);
  const im = new Image();
  im.onload = () => { img = im; crop = null; syncRows(); render(true); };
  im.src = url;
}

$("file").onchange = e => loadFile(e.target.files[0]);
const drop = $("drop");
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); loadFile(e.dataTransfer.files[0]); };

for (const id of ["bri", "con"]) {
  $(id).oninput = () => { $(id + "Out").textContent = $(id).value; render(); };
}

// Aspect ratio: "orig" follows the photo, a number is a fixed width/height ratio,
// and null means the user set the height by hand (width and height independent).
let ratio = "orig", fit = "crop";

function setRows(r) {
  r = Math.max(+$("rows").min, Math.min(+$("rows").max, Math.round(r)));
  $("rows").value = r; $("rowsOut").textContent = r;
}
function syncRows() {
  const cols = +$("cols").value;
  if (ratio === "orig" && img) { const [, , W, H] = baseRect(); setRows(cols * H / W); }
  else if (typeof ratio === "number") setRows(cols / ratio);
}
function selectRatio(r) {
  ratio = r;
  for (const b of $("ratio").children) b.classList.toggle("on", String(r) === b.dataset.r);
}

$("cols").oninput = () => { $("colsOut").textContent = $("cols").value; syncRows(); render(); };
$("rows").oninput = () => { $("rowsOut").textContent = $("rows").value; selectRatio(null); render(); };
$("ratio").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  selectRatio(b.dataset.r === "orig" ? "orig" : +b.dataset.r);
  syncRows(); render();
};
$("fit").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  fit = b.dataset.v;
  for (const x of $("fit").children) x.classList.toggle("on", x === b);
  render();
};

// Which part of the photo to use: centre-crop to the grid's ratio, or the whole photo (stretched)
// The part of the photo the user kept with manual crop (whole photo if none)
let crop = null;   // [x, y, w, h] in image pixels
const baseRect = () => crop || [0, 0, img.width, img.height];

function sourceRect(cols, rows) {
  const [bx, by, W, H] = baseRect(), a = cols / rows;
  if (fit === "stretch" || Math.abs(W / H - a) < 1e-3) return [bx, by, W, H];
  if (W / H > a) { const sw = H * a; return [bx + (W - sw) / 2, by, sw, H]; }
  const sh = W / a; return [bx, by + (H - sh) / 2, W, sh];
}

// ---------- Manual crop ----------
// The box is kept in image pixels; corners and edges resize it, the inside
// moves it, and dragging outside it draws a new one.
const cropModal = $("cropModal"), cropArea = $("cropArea"), cbox = $("cbox");
let box = null, cropAspect = null, drag = null;

function cropScale() { return $("cropImg").clientWidth / img.width; }
function drawBox() {
  const k = cropScale();
  const st = { left: box.x * k + "px", top: box.y * k + "px", width: box.w * k + "px", height: box.h * k + "px" };
  Object.assign(cbox.style, st);
  Object.assign($("shade").style, st);
  $("cropInfo").textContent = `${Math.round(box.w)} × ${Math.round(box.h)} פיקסלים`;
}
const minSide = () => Math.max(8, 0.03 * Math.min(img.width, img.height));

// Resize from a fixed anchor point toward the pointer (corners and new boxes)
function fromAnchor(ax, ay, px, py) {
  const W = img.width, H = img.height, sx = px >= ax ? 1 : -1, sy = py >= ay ? 1 : -1;
  const maxW = sx > 0 ? W - ax : ax, maxH = sy > 0 ? H - ay : ay;
  let w = Math.abs(px - ax), h = Math.abs(py - ay);
  if (cropAspect) {
    const a = cropAspect;
    w = Math.min(Math.max(w, h * a, minSide()), maxW, maxH * a); h = w / a;
  } else {
    w = Math.min(Math.max(w, minSide()), maxW); h = Math.min(Math.max(h, minSide()), maxH);
  }
  box = { x: sx > 0 ? ax : ax - w, y: sy > 0 ? ay : ay - h, w, h };
}

// Resize one edge; with a locked ratio the other side grows around its centre
function fromEdge(edge, px, py, s) {
  const W = img.width, H = img.height, a = cropAspect;
  if (edge === "e" || edge === "w") {
    const ax = edge === "e" ? s.x : s.x + s.w, cy = s.y + s.h / 2;
    let w = Math.max(minSide(), edge === "e" ? px - ax : ax - px);
    w = Math.min(w, edge === "e" ? W - ax : ax);
    let h = s.h;
    if (a) { w = Math.min(w, 2 * Math.min(cy, H - cy) * a); h = w / a; }
    box = { x: edge === "e" ? ax : ax - w, y: a ? cy - h / 2 : s.y, w, h };
  } else {
    const ay = edge === "s" ? s.y : s.y + s.h, cx = s.x + s.w / 2;
    let h = Math.max(minSide(), edge === "s" ? py - ay : ay - py);
    h = Math.min(h, edge === "s" ? H - ay : ay);
    let w = s.w;
    if (a) { h = Math.min(h, 2 * Math.min(cx, W - cx) / a); w = h * a; }
    box = { x: a ? cx - w / 2 : s.x, y: edge === "s" ? ay : ay - h, w, h };
  }
}

// Reshape the box to a new ratio around its centre, as large as still fits
function applyAspect() {
  if (!cropAspect) return;
  const W = img.width, H = img.height, a = cropAspect;
  const cx = box.x + box.w / 2, cy = box.y + box.h / 2;
  let w = Math.min(Math.max(box.w, box.h * a), W, H * a), h = w / a;
  box = { x: Math.min(W - w, Math.max(0, cx - w / 2)), y: Math.min(H - h, Math.max(0, cy - h / 2)), w, h };
}

function toImage(e) {
  const r = $("cropImg").getBoundingClientRect(), k = cropScale();
  return [Math.min(img.width, Math.max(0, (e.clientX - r.left) / k)),
          Math.min(img.height, Math.max(0, (e.clientY - r.top) / k))];
}

cropArea.onpointerdown = e => {
  e.preventDefault();
  cropArea.setPointerCapture(e.pointerId);
  const [px, py] = toImage(e), s = { ...box }, h = e.target.dataset.h;
  if (h && h.length === 2) {           // corner: anchor the opposite corner
    drag = { type: "anchor", ax: h.includes("w") ? s.x + s.w : s.x, ay: h.includes("n") ? s.y + s.h : s.y };
  } else if (h) {
    drag = { type: "edge", edge: h, s };
  } else if (e.target === cbox) {
    drag = { type: "move", px, py, s };
  } else {                             // outside the box: start a new one here
    drag = { type: "anchor", ax: px, ay: py };
    fromAnchor(px, py, px, py); drawBox();
  }
};
cropArea.onpointermove = e => {
  if (!drag) return;
  const [px, py] = toImage(e);
  if (drag.type === "anchor") fromAnchor(drag.ax, drag.ay, px, py);
  else if (drag.type === "edge") fromEdge(drag.edge, px, py, drag.s);
  else {
    const { s } = drag;
    box = { ...s,
      x: Math.min(img.width - s.w, Math.max(0, s.x + px - drag.px)),
      y: Math.min(img.height - s.h, Math.max(0, s.y + py - drag.py)) };
  }
  drawBox();
};
cropArea.onpointerup = cropArea.onpointercancel = () => { drag = null; };

$("cropRatio").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  cropAspect = b.dataset.r === "free" ? null : +b.dataset.r;
  for (const x of $("cropRatio").children) x.classList.toggle("on", x === b);
  applyAspect(); drawBox();
};

function openCrop() {
  if (!img) return;
  finishAnimation();
  const [x, y, w, h] = baseRect();
  box = { x, y, w, h };
  cropModal.hidden = false;
  const ci = $("cropImg");
  if (ci.src !== img.src) { ci.src = img.src; ci.onload = drawBox; } else drawBox();
}
const closeCrop = () => { cropModal.hidden = true; drag = null; };

$("cropBtn").onclick = openCrop;
$("cropCancel").onclick = closeCrop;
$("cropReset").onclick = () => { box = { x: 0, y: 0, w: img.width, h: img.height }; applyAspect(); drawBox(); };
$("cropOk").onclick = () => {
  const full = box.w >= img.width - 1 && box.h >= img.height - 1;
  crop = full ? null : [box.x, box.y, box.w, box.h].map(Math.round);
  closeCrop();
  selectRatio("orig");   // the dice grid follows the shape of the crop
  syncRows(); render(true);
};
cropModal.onclick = e => { if (e.target === cropModal) closeCrop(); };
addEventListener("keydown", e => { if (e.key === "Escape" && !cropModal.hidden) closeCrop(); });
addEventListener("resize", () => { if (!cropModal.hidden) drawBox(); });

// ---------- Before/after comparison ----------
const cmp = $("cmp");
$("compare").onchange = () => {
  cmp.classList.toggle("on", $("compare").checked);
  cmp.style.setProperty("--p", "50%");
};
let dragging = false;
const moveDivider = e => {
  const r = cmp.getBoundingClientRect();
  const p = Math.min(100, Math.max(0, (e.clientX - r.left) / r.width * 100));
  cmp.style.setProperty("--p", p + "%");
};
cmp.onpointerdown = e => {
  if (!$("compare").checked) return;
  dragging = true; cmp.setPointerCapture(e.pointerId); moveDivider(e);
};
cmp.onpointermove = e => { if (dragging) moveDivider(e); };
cmp.onpointerup = cmp.onpointercancel = () => { dragging = false; };

function drawOriginal(rect) {
  const o = $("orig");
  const k = Math.min(1, 1600 / out.width);
  o.width = Math.round(out.width * k); o.height = Math.round(out.height * k);
  const g = o.getContext("2d");
  g.imageSmoothingQuality = "high";
  g.drawImage(img, ...rect, 0, 0, o.width, o.height);
}
$("dither").onchange = () => render();
$("invert").onchange = () => render();
$("style").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  style = b.dataset.v;
  for (const x of $("style").children) x.classList.toggle("on", x === b);
  render();
};

// Sample the image down to cols x rows grayscale values (0..1)
function sample(cols, rows, rect) {
  const c = document.createElement("canvas");
  c.width = cols; c.height = rows;
  const g = c.getContext("2d");
  g.imageSmoothingQuality = "high";
  g.drawImage(img, ...rect, 0, 0, cols, rows);
  const d = g.getImageData(0, 0, cols, rows).data;

  const bri = +$("bri").value / 100;
  const con = +$("con").value;
  const f = (259 * (con + 255)) / (255 * (259 - con)); // standard contrast factor
  const gray = new Float32Array(cols * rows);
  for (let i = 0; i < gray.length; i++) {
    let v = (0.299 * d[i*4] + 0.587 * d[i*4+1] + 0.114 * d[i*4+2]) / 255;
    v = f * (v - 0.5) + 0.5 + bri;
    if ($("invert").checked) v = 1 - v;
    gray[i] = Math.min(1, Math.max(0, v));
  }
  return { gray, cols, rows };
}

// How bright each face looks, from darkest (index 0) to brightest (index 5).
// Black dice: more white pips = brighter, so 1..6. White dice: more black pips = darker, so 6..1.
function faceOrder() { return style === "black" ? [1,2,3,4,5,6] : [6,5,4,3,2,1]; }

function toFaces({ gray, cols, rows }) {
  const order = faceOrder();
  const faces = new Uint8Array(cols * rows);
  const dither = $("dither").checked;
  const g = Float32Array.from(gray);
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const i = y * cols + x;
      const level = Math.min(5, Math.max(0, Math.round(g[i] * 5)));
      faces[i] = order[level];
      if (!dither) continue;
      // Floyd–Steinberg error diffusion over 6 levels
      const err = g[i] - level / 5;
      if (x + 1 < cols) g[i + 1] += err * 7 / 16;
      if (y + 1 < rows) {
        if (x > 0) g[i + cols - 1] += err * 3 / 16;
        g[i + cols] += err * 5 / 16;
        if (x + 1 < cols) g[i + cols + 1] += err * 1 / 16;
      }
    }
  }
  return faces;
}

function drawDie(g, x, y, s, face, body, pip) {
  const m = s * 0.06, r = s * 0.18, w = s - 2 * m;
  g.fillStyle = body;
  g.beginPath();
  g.roundRect(x + m, y + m, w, w, r);
  g.fill();
  g.fillStyle = pip;
  const pr = s * 0.085, step = w * 0.29, cx = x + s / 2, cy = y + s / 2;
  for (const [px, py] of PIPS[face]) {
    g.beginPath();
    g.arc(cx + (px - 1) * step, cy + (py - 1) * step, pr, 0, Math.PI * 2);
    g.fill();
  }
}

// Pre-render each face once (transparent background) so drawing thousands is cheap
function makeSprites(s, body, pip) {
  const sprites = [null];
  for (let f = 1; f <= 6; f++) {
    const c = document.createElement("canvas");
    c.width = c.height = s;
    drawDie(c.getContext("2d"), 0, 0, s, f, body, pip);
    sprites.push(c);
  }
  return sprites;
}

function colors() {
  return style === "black"
    ? { bg: "#0e0e0e", body: "#262626", pip: "#f5f5f5" }
    : { bg: "#d8d8d8", body: "#fbfbfb", pip: "#111111" };
}

function drawStatic() {
  const { faces, cols, rows, s, bg, sprites } = cur;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, out.width, out.height);
  for (let y = 0; y < rows; y++)
    for (let x = 0; x < cols; x++)
      ctx.drawImage(sprites[faces[y * cols + x]], x * s, y * s);
}

// Dice tumble in as a diagonal wave from the top-left corner, spinning and
// flicking through random faces until each one lands on its final face.
function roll() {
  cancelAnimationFrame(animId);
  const { faces, cols, rows, s, bg, sprites } = cur;
  const n = cols * rows;
  const WAVE = 2200, SPIN = 650, JITTER = 450;
  const land = new Float32Array(n);
  const spinDir = new Int8Array(n);
  for (let y = 0; y < rows; y++)
    for (let x = 0; x < cols; x++) {
      const i = y * cols + x;
      land[i] = SPIN + (x + y) / (cols + rows - 1) * WAVE + Math.random() * JITTER;
      spinDir[i] = Math.random() < 0.5 ? -1 : 1;
    }
  const order = Array.from({ length: n }, (_, i) => i).sort((a, b) => land[a] - land[b]);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, out.width, out.height);

  let done = 0;  // order[0..done) have landed and been drawn for good
  const t0 = performance.now();
  const frame = now => {
    const t = now - t0;
    for (let k = done; k < n; k++) {
      const i = order[k];
      const start = land[i] - SPIN;
      if (start > t) break;                 // later dice haven't started yet
      const x = (i % cols) * s, y = Math.floor(i / cols) * s;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = bg;
      ctx.fillRect(x, y, s, s);
      if (t >= land[i]) {
        ctx.drawImage(sprites[faces[i]], x, y);
        if (k === done) done++;
        continue;
      }
      const p = (t - start) / SPIN;          // 0 → 1 while rolling
      const ease = 1 - Math.pow(1 - p, 3);
      const ang = spinDir[i] * (1 - ease) * Math.PI * 2.5;
      // Shrink while rotated so the die never spills into its neighbours
      const fit = 1 / (Math.abs(Math.cos(ang)) + Math.abs(Math.sin(ang)));
      const face = 1 + ((i * 7 + Math.floor(t / 70)) % 6);
      ctx.setTransform(fit, 0, 0, fit, x + s / 2, y + s / 2);
      ctx.rotate(ang);
      ctx.globalAlpha = Math.min(1, p * 3);
      ctx.drawImage(sprites[face], -s / 2, -s / 2);
      ctx.globalAlpha = 1;
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (done < n) animId = requestAnimationFrame(frame);
    else { animId = 0; drawStatic(); }
  };
  animId = requestAnimationFrame(frame);
}

function render(animate = false) {
  if (!img) return;
  cancelAnimationFrame(animId); animId = 0;
  const cols = +$("cols").value, rows = +$("rows").value;
  const rect = sourceRect(cols, rows);
  const faces = toFaces(sample(cols, rows, rect));
  const s = Math.max(8, Math.min(24, Math.floor(4000 / Math.max(cols, rows))));
  out.width = cols * s; out.height = rows * s;
  drawOriginal(rect);
  const { bg, body, pip } = colors();
  cur = { faces, cols, rows, s, bg, body, pip, sprites: makeSprites(s, body, pip) };

  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (animate && !reduced) roll(); else drawStatic();

  $("empty").hidden = true;
  out.hidden = false;
  for (const id of ["download", "replay", "printBtn", "cropBtn"]) $(id).disabled = false;
  const counts = countFaces();
  const pages = Math.ceil(cols / PAGE_COLS) * Math.ceil(rows / PAGE_ROWS);
  $("stats").innerHTML =
    `<b>${(cols * rows).toLocaleString()}</b> קוביות · ${cols}×${rows} · תוכנית בנייה: ${pages + 1} עמודים<br>` +
    [1,2,3,4,5,6].map(f => `${"⚀⚁⚂⚃⚄⚅"[f-1]} ${counts[f].toLocaleString()}`).join(" &nbsp; ");
}

function countFaces() {
  const counts = [0,0,0,0,0,0,0];
  for (const f of cur.faces) counts[f]++;
  return counts;
}

function finishAnimation() {
  if (animId) { cancelAnimationFrame(animId); animId = 0; drawStatic(); }
}

$("replay").onclick = () => { if (cur) roll(); };

$("download").onclick = () => {
  finishAnimation();
  const a = document.createElement("a");
  a.download = "dice-art.png";
  a.href = out.toDataURL("image/png");
  a.click();
};

// ---------- Printable build plan ----------
// The mosaic is split into A4 sections; each section is a numbered grid that
// says which face should point up in every cell.
const PAGE_COLS = 30, PAGE_ROWS = 40;
const colLetter = i => String.fromCharCode(65 + (i % 26)) + (i >= 26 ? Math.floor(i / 26) : "");

function overviewImage(secX, secY) {
  finishAnimation();
  const { cols, rows, s } = cur;
  const k = Math.min(1, 1800 / out.width);
  const c = document.createElement("canvas");
  c.width = Math.round(out.width * k); c.height = Math.round(out.height * k);
  const g = c.getContext("2d");
  g.drawImage(out, 0, 0, c.width, c.height);
  const cell = s * k;
  g.strokeStyle = "#e8890c"; g.lineWidth = Math.max(2, c.width / 400);
  g.fillStyle = "#e8890c"; g.textAlign = "center"; g.textBaseline = "middle";
  for (let sy = 0; sy < secY; sy++)
    for (let sx = 0; sx < secX; sx++) {
      const x = sx * PAGE_COLS * cell, y = sy * PAGE_ROWS * cell;
      const w = Math.min(PAGE_COLS, cols - sx * PAGE_COLS) * cell;
      const h = Math.min(PAGE_ROWS, rows - sy * PAGE_ROWS) * cell;
      g.strokeRect(x, y, w, h);
      const fs = Math.min(w, h) * 0.28;
      g.font = `700 ${fs}px system-ui, sans-serif`;
      g.lineWidth = fs / 8; g.strokeStyle = "#000";
      g.strokeText(colLetter(sx) + (sy + 1), x + w / 2, y + h / 2);
      g.fillText(colLetter(sx) + (sy + 1), x + w / 2, y + h / 2);
      g.strokeStyle = "#e8890c"; g.lineWidth = Math.max(2, c.width / 400);
    }
  return c.toDataURL("image/png");
}

function buildPrint() {
  const { faces, cols, rows } = cur;
  const secX = Math.ceil(cols / PAGE_COLS), secY = Math.ceil(rows / PAGE_ROWS);
  const counts = countFaces();
  // Light shading of each cell by its brightness, so the picture shows through the numbers
  const order = faceOrder();
  const shade = {};
  order.forEach((f, lvl) => { const v = Math.round(170 + lvl * 17); shade[f] = `rgb(${v},${v},${v})`; });
  const legendSprites = makeSprites(80, cur.body, cur.pip);

  let html = `<section class="ppage">
    <h2>תוכנית בנייה — תמונה מקוביות 🎲</h2>
    <p><b>${(cols * rows).toLocaleString()}</b> קוביות · ${cols} עמודות × ${rows} שורות · ${secX * secY} חלקים</p>
    <img class="overview" src="${overviewImage(secX, secY)}">
    <div class="legend">${[1,2,3,4,5,6].map(f =>
      `<div><img src="${legendSprites[f].toDataURL()}">${f} · ${counts[f].toLocaleString()} יח׳</div>`).join("")}</div>
    <ul>
      <li>כל עמוד הבא הוא חלק אחד מהתמונה (A1, B1, …) לפי המפה למעלה.</li>
      <li>המספר בכל משבצת = מספר הנקודות שצריך להיות כלפי מעלה בקובייה.</li>
      <li>מסגרות עבות כל 5 משבצות עוזרות לא ללכת לאיבוד.</li>
      <li>שימו לב לכיוון: ב־2, 3 ו־6 סובבו את הקובייה כמו במקרא (אלכסון משמאל־למעלה, טורים אנכיים).</li>
      <li>צבע הקוביות: ${style === "black" ? "שחורות עם נקודות לבנות" : "לבנות עם נקודות שחורות"}.</li>
    </ul>
  </section>`;

  for (let sy = 0; sy < secY; sy++)
    for (let sx = 0; sx < secX; sx++) {
      const x0 = sx * PAGE_COLS, y0 = sy * PAGE_ROWS;
      const x1 = Math.min(cols, x0 + PAGE_COLS), y1 = Math.min(rows, y0 + PAGE_ROWS);
      let t = `<tr><th></th>`;
      for (let x = x0; x < x1; x++) t += `<th>${x + 1}</th>`;
      t += `<th></th></tr>`;
      for (let y = y0; y < y1; y++) {
        t += `<tr><th>${y + 1}</th>`;
        for (let x = x0; x < x1; x++) {
          const f = faces[y * cols + x];
          const cls = [(x - x0) % 5 === 4 ? "r5" : "", (y - y0) % 5 === 4 ? "b5" : ""].join(" ").trim();
          t += `<td${cls ? ` class="${cls}"` : ""} style="background:${shade[f]}">${f}</td>`;
        }
        t += `<th>${y + 1}</th></tr>`;
      }
      html += `<section class="ppage">
        <h3>חלק ${colLetter(sx)}${sy + 1} · עמודות ${x0 + 1}–${x1} · שורות ${y0 + 1}–${y1}</h3>
        <table class="grid">${t}</table>
      </section>`;
    }
  $("print").innerHTML = html;
}

$("printBtn").onclick = () => {
  if (!cur) return;
  buildPrint();
  // Give the overview/legend images a moment to decode before the print dialog opens
  setTimeout(() => window.print(), 300);
};
</script>
</body>
</html>
